<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css">
<title>Color Vision Explorer</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #fff;
    box-sizing: border-box;
    padding: 64px 32px;
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
  }
  svg {
    width: 100%;
    height: 100%;
    max-width: 1500px;
    max-height: 720px;
  }
  line, path {
    stroke: #fff;
    fill: none;
  }
  text {
    fill: #fff;
    stroke: none;
    font-family: 'Iosevka', ui-monospace, Menlo, Consolas, monospace;
    font-size: var(--chart-font-size, 13px);
  }
  .toggle-row {
    display: flex;
    gap: 28px;
    font-family: 'Iosevka', ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .toggle-row button {
    background: none;
    border: none;
    color: #fff;
    font: inherit;
    padding: 4px 0;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.5px;
  }
  .toggle-row button[data-active="true"] {
    text-decoration: underline;
    text-underline-offset: 5px;
  }
  .toggle-row button:focus-visible {
    outline: 1px solid #fff;
  }
  .section {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 12px;
  }
  .section-label {
    font-family: 'Iosevka', ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }
  .band-controls {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .band-controls[hidden] {
    display: none;
  }
  .band-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .band-control input[type="range"] {
    accent-color: #fff;
    width: 140px;
  }
  #color-peak {
    /* nm increases right-to-left in frequency terms; flip so lower frequency (higher nm) sits left,
       matching the chart's own axis orientation. */
    transform: scaleX(-1);
  }
  .band-control output {
    min-width: 6.5ch;
  }
  .band-control select {
    background: #000;
    color: #fff;
    font: inherit;
    border: 1px solid #fff;
    padding: 3px 4px;
    max-width: 320px;
  }
  .results {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 20px;
    font-family: 'Iosevka', ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .results[hidden] {
    display: none;
  }
  .results-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .swatch {
    width: 140px;
    border: 1px solid #fff;
    background: #000;
    flex-shrink: 0;
  }

  /* --- SINGULARITY site chrome --- */
  .site-back{ position:fixed; top:10px; left:12px; z-index:1000; font-family:'Iosevka', ui-monospace, Menlo, Consolas, monospace; font-weight:300; font-size:12px;
    color:#8a8a8a; background:#000; padding:2px 6px; text-decoration:none; }
  .site-back:hover{ color:#E8350A; }
  body{ font-variant-ligatures:none; }
</style>
</head>
<body>
<a class="site-back" href="/color/">&larr; SINGULARITY / Color</a>
<div class="controls">
  <div class="section">
    <div class="section-label">CONE SENSITIVITY:</div>
    <div id="cone-toggle" class="toggle-row">
      <button data-key="off">OFF</button>
      <button data-key="parametric" data-active="true">PARAMETRIC</button>
      <button data-key="ss2">STOCKMAN &amp; SHARPE (2000), 2&deg;</button>
      <button data-key="ss10">CIE (2006) PHYSIOLOGICAL OBSERVER, 10&deg;</button>
    </div>
  </div>
  <div class="section">
    <div class="section-label">PIXEL OUTPUT:</div>
    <div id="subpixel-toggle" class="toggle-row">
      <button data-key="off">OFF</button>
      <button data-key="parametric" data-active="true">PARAMETRIC</button>
      <button data-key="measured">MEASURED (HUAWEI HONOR V10, 2020)</button>
    </div>
  </div>
  <div class="section">
    <div class="section-label">COLOR:</div>
    <div id="color-toggle" class="toggle-row">
      <button data-key="off" data-active="true">OFF</button>
      <button data-key="parametric">PARAMETRIC</button>
      <button data-key="sample">SAMPLE</button>
      <span id="color-controls-parametric" class="band-controls" hidden>
        <label class="band-control">PEAK
          <input type="range" id="color-peak" min="380" max="700" value="550" step="1">
          <output id="color-peak-readout">550nm</output>
        </label>
        <label class="band-control">BANDWIDTH
          <input type="range" id="color-bandwidth" min="5" max="150" value="40" step="1">
          <output id="color-bandwidth-readout">40nm</output>
        </label>
      </span>
      <span id="color-controls-sample" class="band-controls" hidden>
        <label class="band-control">SAMPLE
          <select id="color-sample-select">
            <optgroup label="PIGMENTS (ColorChecker Classic, measured)">
              <option value="pigment:Red">Red</option>

              <option value="pigment:Orange Yellow">Orange Yellow</option>
              <option value="pigment:Yellow">Yellow</option>
              <option value="pigment:Green">Green</option>
              <option value="pigment:Cyan">Cyan</option>
              <option value="pigment:Blue">Blue</option>
              <option value="pigment:Purplish Blue">Purplish Blue</option>
              <option value="pigment:Purple">Purple</option>
              <option value="pigment:Magenta">Magenta</option>
            </optgroup>
            <optgroup label="FLOWERS (real specimens, measured)">
              <option value="flower:Poppy">Poppy</option>
              <option value="flower:Rose (dark red)">Rose (dark red)</option>
              <option value="flower:Carnation">Carnation</option>
              <option value="flower:Marigold">Marigold</option>
              <option value="flower:Dandelion">Dandelion</option>
              <option value="flower:Buttercup">Buttercup</option>
              <option value="flower:Pansy (violet)">Pansy (violet)</option>
              <option value="flower:Fireweed">Fireweed</option>
              <option value="flower:Borage">Borage</option>
              <option value="flower:Petunia (white)">Petunia (white)</option>
            </optgroup>
          </select>
        </label>
      </span>
    </div>
  </div>
</div>

  };

  function interpDataset(data, colIndex, nm){
    if (nm < data[0][0] || nm > data[data.length - 1][0]) return 0;
    for (var i = 0; i < data.length - 1; i++){
      var a = data[i], b = data[i + 1];
      if (nm >= a[0] && nm <= b[0]){
        var av = a[colIndex] === null ? 0 : a[colIndex];
        var bv = b[colIndex] === null ? 0 : b[colIndex];
        var t = (nm - a[0]) / (b[0] - a[0]);
        return av + (bv - av) * t;
      }
    }
    return 0;
  }

  var DATASETS = {
    parametric: {
      L: paramL, M: paramM, S: paramS
    },
    ss2: {
      L: function(nm){ return interpDataset(SS2_DATA, 1, nm); },
      M: function(nm){ return interpDataset(SS2_DATA, 2, nm); },
      S: function(nm){ return interpDataset(SS2_DATA, 3, nm); }
    },
    ss10: {
      L: function(nm){ return interpDataset(SS10_DATA, 1, nm); },
      M: function(nm){ return interpDataset(SS10_DATA, 2, nm); },
      S: function(nm){ return interpDataset(SS10_DATA, 3, nm); }
    }
  };

  // bottom of visible spectrum (700nm) -> lowest frequency -> left
  // top of visible spectrum (380nm) -> highest frequency -> right
  var F_MIN = C / 700; // ~428.3 THz
  var F_MAX = C / 380; // ~788.9 THz

  // ---- layout ----
  var PLOT_X0 = 70, PLOT_X1 = 890;
  var AXIS_Y = 360;
  var SCALE = 260; // px per unit sensitivity

  function xToPx(fTHz){
    return PLOT_X0 + (fTHz - F_MIN) / (F_MAX - F_MIN) * (PLOT_X1 - PLOT_X0);
  }
  function yToPx(sensitivity){
    return AXIS_Y - sensitivity * SCALE;
  }

  var svg = document.getElementById("chart");
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- dynamic layer (curves + labels, redrawn on toggle) ----
  var dynamicLayer = el("g", { id: "dynamic" });
  svg.appendChild(dynamicLayer);

  // ---- phone OLED RGB subpixel emission (parametric Gaussian, or a real measured example) ----
  // FWHM -> Gaussian sigma: FWHM = 2*sqrt(2*ln2)*sigma
  var FWHM_TO_SIGMA = 2 * Math.sqrt(2 * Math.LN2);
  function gaussFWHM(nm, peakNm, fwhmNm){ return gauss(nm, peakNm, fwhmNm / FWHM_TO_SIGMA); }

  // "Parametric": generic round peak values commonly cited for phone OLEDs, with an illustrative
  // narrow-band width (not measured).
  // "Measured": real peak wavelength / FWHM values reported for a Huawei Honor V10 smartphone display
  // in Yao, Zhang, Dai, Wang & Wu, "Chromaticity-based real-time assessment of melanopic and luminous
  // efficiency of smartphone displays," Optics Express 28(4), 4898-4910 (2020) -- R 606/55nm, G 538/55nm,
  // B 445/18nm (peak/FWHM). The same paper surveyed 54 phones and found peaks clustering around 450/530/630nm.
  var SUBPIXEL_DATASETS = {
    parametric: {
      R: function(nm){ return gaussFWHM(nm, 630, 30); },
      G: function(nm){ return gaussFWHM(nm, 530, 30); },
      B: function(nm){ return gaussFWHM(nm, 450, 30); }
    },
    measured: {
      R: function(nm){ return gaussFWHM(nm, 606, 55); },
      G: function(nm){ return gaussFWHM(nm, 538, 55); },
      B: function(nm){ return gaussFWHM(nm, 445, 18); }
    }
  };

  var SUBPIXEL_ORDER = [
    { key: "R", label: "R", color: "#ff0000" },
    { key: "G", label: "G", color: "#00ff00" },
    { key: "B", label: "B", color: "#0000ff" }
  ];
  var SUBPIXEL_LABEL_Y = 60;
  var subpixelLayer = el("g", { id: "subpixels" });
  svg.appendChild(subpixelLayer);

  // ---- user-editable / user-selectable color band ----
  // Peak height always matches every other curve (amplitude 1) -- both the parametric Gaussian and the
  // sample-derived curve (reflectance * D65, see updateColorBand) are normalized to a peak of 1 before
  // being drawn, so widening/choosing a sample only ever changes shape, never plotted height.
  var colorBandLayer = el("g", { id: "color-band" });
  svg.appendChild(colorBandLayer);

  function renderColorBand(fn){
    while (colorBandLayer.firstChild) colorBandLayer.removeChild(colorBandLayer.firstChild);
    if (fn === null) return;
    // filled region (not an outline) so it reads as a shaded band rather than one more
    // white curve competing with the L/M/S lines
    var d = "M" + xToPx(F_MIN).toFixed(2) + " " + AXIS_Y;
    for (var i = 0; i <= STEPS; i++){
      var f = F_MIN + (F_MAX - F_MIN) * i / STEPS;
      var nm = freqToWavelength(f);
      var x = xToPx(f), y = yToPx(fn(nm));
      d += " L" + x.toFixed(2) + " " + y.toFixed(2);
    }
    d += " L" + xToPx(F_MAX).toFixed(2) + " " + AXIS_Y + " Z";
    colorBandLayer.appendChild(el("path", { d: d, style: "fill:rgba(255,255,255,0.18); stroke:none" }));
  }

  // ---- what the cones would register for a given spectrum ----
  // Each cone's raw response is the overlap integral of its sensitivity curve with the spectrum's
  // shape (sum over 1nm steps -- the arbitrary absolute scale cancels out once we normalize to a
  // percentage of the L+M+S total, which is all that matters for a ratio).
  function overlapIntegral(coneFn, spectrumFn){
    var sum = 0;
    for (var nm = 380; nm <= 700; nm += 1){
      sum += coneFn(nm) * spectrumFn(nm);
    }
    return sum;
  }

  function percentagesFromRaw(L, M, S){
    var total = L + M + S;
    if (total <= 0) return { L: 0, M: 0, S: 0 };
    var pctL = Math.round(100 * L / total);
    var pctM = Math.round(100 * M / total);
    var pctS = 100 - pctL - pctM; // forces an exact 100% total instead of independent-rounding drift
    return { L: pctL, M: pctM, S: pctS };
  }

  function computeConeResponse(coneKey, spectrumFn){
    if (coneKey === "off") return null;
    var fns = DATASETS[coneKey];
    return percentagesFromRaw(
      overlapIntegral(fns.L, spectrumFn),
      overlapIntegral(fns.M, spectrumFn),
      overlapIntegral(fns.S, spectrumFn)
    );
  }

  // ---- solve for the RGB mix (of the currently selected subpixel primaries) that gives the ----
  // ---- closest cone match to the target spectrum, then see what spectrum that mix actually is ----
  function solve3x3(A, b){
    function det3(m){
      return m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
           - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
           + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    }
    var D = det3(A);
    if (D === 0) return null;
    function withCol(col, vec){ return A.map(function(row, i){ return row.map(function(v, j){ return j === col ? vec[i] : v; }); }); }
    return [det3(withCol(0, b)) / D, det3(withCol(1, b)) / D, det3(withCol(2, b)) / D];
  }

  function solveRGBApproximation(coneKey, subpixelKey, spectrumFn){
    if (coneKey === "off" || subpixelKey === "off") return null;
    var coneFns = DATASETS[coneKey];
    var subFns = SUBPIXEL_DATASETS[subpixelKey];
    var coneOrder = ["L", "M", "S"];
    var primaryOrder = ["R", "G", "B"];
    var A = coneOrder.map(function(c){
      return primaryOrder.map(function(p){ return overlapIntegral(coneFns[c], subFns[p]); });
    });
    var target = coneOrder.map(function(c){ return overlapIntegral(coneFns[c], spectrumFn); });
    var solved = solve3x3(A, target);
    if (!solved) return null;
    var neededClamp = solved.some(function(v){ return v < 0; });
    var clamped = solved.map(function(v){ return Math.max(0, v); });
    var maxVal = Math.max.apply(null, clamped);
    var scaled = maxVal > 0 ? clamped.map(function(v){ return Math.round(255 * v / maxVal); }) : [0, 0, 0];
    return {
      r: scaled[0], g: scaled[1], b: scaled[2],
      clamped: neededClamp,
      mixFn: function(nm){
        return (scaled[0] / 255) * subFns.R(nm) + (scaled[1] / 255) * subFns.G(nm) + (scaled[2] / 255) * subFns.B(nm);
      }
    };
  }

  // ---- static axis (drawn last, so it stays on top of every curve) ----
  svg.appendChild(el("line", {
    x1: PLOT_X0, y1: AXIS_Y, x2: PLOT_X1, y2: AXIS_Y, "stroke-width": 1.5
  }));
  [PLOT_X0, PLOT_X1].forEach(function(x){
    svg.appendChild(el("line", {
      x1: x, y1: AXIS_Y, x2: x, y2: AXIS_Y + 10, "stroke-width": 1.5
    }));
  });
  var leftLabel = el("text", { x: PLOT_X0, y: AXIS_Y + 32, "text-anchor": "start" });
  leftLabel.textContent = "428 THz  (700 nm)";
  svg.appendChild(leftLabel);
  var rightLabel = el("text", { x: PLOT_X1, y: AXIS_Y + 32, "text-anchor": "end" });
  rightLabel.textContent = "789 THz  (380 nm)";
  svg.appendChild(rightLabel);
  var axisTitle = el("text", {
    x: (PLOT_X0 + PLOT_X1) / 2, y: AXIS_Y + 55,
    "text-anchor": "middle", "letter-spacing": "2"
  });
  axisTitle.textContent = "LIGHT FREQUENCY";
  svg.appendChild(axisTitle);

  function renderSubpixels(datasetKey){
    while (subpixelLayer.firstChild) subpixelLayer.removeChild(subpixelLayer.firstChild);
    if (datasetKey === "off") return;
    var fns = SUBPIXEL_DATASETS[datasetKey];

    SUBPIXEL_ORDER.forEach(function(sp){
      var fn = fns[sp.key];
      var d = "";
      var peak = { f: F_MIN, v: -1 };
      for (var i = 0; i <= STEPS; i++){
        var f = F_MIN + (F_MAX - F_MIN) * i / STEPS;
        var nm = freqToWavelength(f);
        var v = fn(nm);
        if (v > peak.v) peak = { f: f, v: v };
        var x = xToPx(f), y = yToPx(v);
        d += (i === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
      }
      subpixelLayer.appendChild(el("path", { d: d, "stroke-width": 1.75, style: "stroke:" + sp.color }));

      var lbl = el("text", {
        x: xToPx(peak.f), y: SUBPIXEL_LABEL_Y, "text-anchor": "middle", style: "fill:" + sp.color
      });
      lbl.textContent = sp.label + "  " + peak.f.toFixed(0) + " THz";
      subpixelLayer.appendChild(lbl);
    });
  }

  var CONE_ORDER = [
    { key: "L", label: "L", labelDy: -26 },
    { key: "M", label: "M", labelDy: -10 },
    { key: "S", label: "S", labelDy: -10 }
  ];
  var STEPS = 200;

  function render(datasetKey){
    while (dynamicLayer.firstChild) dynamicLayer.removeChild(dynamicLayer.firstChild);
    if (datasetKey === "off") return;
    var fns = DATASETS[datasetKey];

    CONE_ORDER.forEach(function(cone){
      var fn = fns[cone.key];
      var d = "";
      var peak = { f: F_MIN, v: -1 };
      for (var i = 0; i <= STEPS; i++){
        var f = F_MIN + (F_MAX - F_MIN) * i / STEPS;
        var nm = freqToWavelength(f);
        var v = fn(nm);
        if (v > peak.v) peak = { f: f, v: v };
        var x = xToPx(f), y = yToPx(v);
        d += (i === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
      }
      dynamicLayer.appendChild(el("path", { d: d, "stroke-width": 1.75 }));

      var labelEl = el("text", {
        x: xToPx(peak.f), y: yToPx(peak.v) + cone.labelDy,
        "text-anchor": "middle"
      });
      labelEl.textContent = cone.label + "  " + peak.f.toFixed(0) + " THz";
      dynamicLayer.appendChild(labelEl);
    });
  }

  // ---- toggle wiring ----
  var currentConeKey = "parametric";
  var coneButtons = document.querySelectorAll("#cone-toggle button");
  coneButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      coneButtons.forEach(function(b){ b.setAttribute("data-active", "false"); });
      btn.setAttribute("data-active", "true");
      currentConeKey = btn.getAttribute("data-key");
      render(currentConeKey);
      updateColorBand();
    });
  });

  var currentSubpixelKey = "parametric";
  var subpixelButtons = document.querySelectorAll("#subpixel-toggle button");
  subpixelButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      subpixelButtons.forEach(function(b){ b.setAttribute("data-active", "false"); });
      btn.setAttribute("data-active", "true");
      currentSubpixelKey = btn.getAttribute("data-key");
      renderSubpixels(currentSubpixelKey);
      updateColorBand();
    });
  });

  var currentColorMode = "off"; // off | parametric | sample
  var colorButtons = document.querySelectorAll("#color-toggle button");
  var colorControlsParametric = document.getElementById("color-controls-parametric");
  var colorControlsSample = document.getElementById("color-controls-sample");
  var colorPeakInput = document.getElementById("color-peak");
  var colorBandwidthInput = document.getElementById("color-bandwidth");
  var colorPeakReadout = document.getElementById("color-peak-readout");
  var colorBandwidthReadout = document.getElementById("color-bandwidth-readout");
  var colorSampleSelect = document.getElementById("color-sample-select");
  var resultsEl = document.getElementById("results");
  var actualConeResponseEl = document.getElementById("actual-cone-response");
  var rgbApproxTextEl = document.getElementById("rgb-approx-text");
  var rgbSwatchEl = document.getElementById("rgb-swatch");
  var screenConeResponseEl = document.getElementById("screen-cone-response");

  function updateColorBand(){
    if (currentColorMode === "off"){
      renderColorBand(null);
      return;
    }

    var bandFn;
    if (currentColorMode === "parametric"){
      var peakNm = parseFloat(colorPeakInput.value);
      var bandwidthNm = parseFloat(colorBandwidthInput.value);
      colorPeakReadout.textContent = peakNm.toFixed(0) + "nm";
      colorBandwidthReadout.textContent = bandwidthNm.toFixed(0) + "nm";
      bandFn = function(nm){ return gaussFWHM(nm, peakNm, bandwidthNm); };
    } else {
      // "sample": look up the selected item's real reflectance spectrum, multiply by the D65
      // daylight illuminant to get an actual light spectrum, then normalize to a peak of 1 so it
      // draws at the same height as every other curve (see the comment above colorBandLayer).
      var key = colorSampleSelect.value;
      var sep = key.indexOf(":");
      var group = key.slice(0, sep), name = key.slice(sep + 1);
      var reflData = (group === "pigment" ? PIGMENT_DATA : FLOWER_DATA)[name];
      var rawFn = function(nm){ return interpDataset(reflData, 1, nm) * interpDataset(D65_DATA, 1, nm); };
      var peakVal = 0;
      for (var i = 0; i <= STEPS; i++){
        var f = F_MIN + (F_MAX - F_MIN) * i / STEPS;
        var nm2 = freqToWavelength(f);
        var v = rawFn(nm2);
        if (v > peakVal) peakVal = v;
      }
      if (peakVal <= 0) peakVal = 1;
      bandFn = function(nm){ return rawFn(nm) / peakVal; };
    }

    renderColorBand(bandFn);

    var actual = computeConeResponse(currentConeKey, bandFn);
    actualConeResponseEl.textContent = actual
      ? "ACTUAL CONE RESPONSE  L " + actual.L + "%  M " + actual.M + "%  S " + actual.S + "%"
      : "ACTUAL CONE RESPONSE  (cone sensitivity is off)";

    var rgb = solveRGBApproximation(currentConeKey, currentSubpixelKey, bandFn);
    if (!rgb){
      rgbApproxTextEl.textContent = "RGB APPROXIMATION  (requires cone sensitivity and pixel output)";
      rgbSwatchEl.style.background = "#000";
      screenConeResponseEl.textContent = "RESULTING SCREEN BAND, CONE RESPONSE  (requires cone sensitivity and pixel output)";
      return;
    }
    rgbApproxTextEl.textContent = "RGB APPROXIMATION  R " + rgb.r + "  G " + rgb.g + "  B " + rgb.b
      + (rgb.clamped ? "  (clamped -- outside this display's gamut)" : "");
    rgbSwatchEl.style.background = "rgb(" + rgb.r + "," + rgb.g + "," + rgb.b + ")";

    var screen = computeConeResponse(currentConeKey, rgb.mixFn);
    screenConeResponseEl.textContent = "RESULTING SCREEN BAND, CONE RESPONSE  L " + screen.L + "%  M " + screen.M + "%  S " + screen.S + "%";
  }

  colorButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      colorButtons.forEach(function(b){ b.setAttribute("data-active", "false"); });
      btn.setAttribute("data-active", "true");
      currentColorMode = btn.getAttribute("data-key");
      colorControlsParametric.hidden = currentColorMode !== "parametric";
      colorControlsSample.hidden = currentColorMode !== "sample";
      resultsEl.hidden = currentColorMode === "off";
      updateColorBand();
    });
  });
  colorPeakInput.addEventListener("input", updateColorBand);
  colorBandwidthInput.addEventListener("input", updateColorBand);
  colorSampleSelect.addEventListener("change", updateColorBand);

  render("parametric");
  renderSubpixels("parametric");

  // ---- keep chart text the same rendered size as the menu text (13px), regardless of ----
  // ---- how much the responsive SVG is scaled up or down from its 960-unit viewBox ----
  var MENU_FONT_PX = 13;
  function syncChartFontSize(){
    var scale = svg.getBoundingClientRect().width / 960;
    if (scale > 0) document.documentElement.style.setProperty("--chart-font-size", (MENU_FONT_PX / scale) + "px");
  }

  window.addEventListener("resize", syncChartFontSize);
})();
